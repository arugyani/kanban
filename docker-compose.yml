services:
  kanbancord:
    build:
      context: .
    environment:
      Discord__Token: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      Database__ConnectionString: mongodb://mongo:27017
      Database__Name: ${DATABASE_NAME:-KanbanCord}
      Web__ApiKey: ${WEB_API_KEY:?Set WEB_API_KEY to at least 32 random bytes}
      Web__AdministratorDiscordUserIds__0: ${ADMIN_DISCORD_USER_ID:?Set ADMIN_DISCORD_USER_ID}
      Web__PublicBoardUrl: ${PUBLIC_BOARD_URL:-}
      Urls: http://0.0.0.0:5000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-KanbanCord}
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
