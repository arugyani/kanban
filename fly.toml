# fly.toml app configuration file generated for boof-ban on 2026-08-14T00:52:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'boof-ban'
primary_region = 'ewr'

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  Urls = "http://0.0.0.0:5000"
  DOTNET_ENVIRONMENT = "Production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[deploy]
  strategy = "rolling"

[[restart]]
  policy = "always"

[checks]
  [checks.health]
    type = "http"
    port = 5000
    method = "get"
    path = "/health"
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
